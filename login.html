<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Cringley Cottage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #232120; --cream: #f3ede3; --stone: #dfd8cb;
    --sage: #5e7a52; --sage-light: #84a472; --muted: #7a6f60;
  }
  body {
    font-family: 'DM Sans', sans-serif; background: var(--ink); color: var(--cream);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 2rem 6%;
  }
  .box { width: 100%; max-width: 380px; }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.9rem; margin-bottom: 0.4rem; text-align: center; }
  p.sub { text-align: center; color: rgba(247,242,234,0.5); font-size: 0.85rem; margin-bottom: 2rem; }
  label { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(247,242,234,0.55); margin-bottom: 0.4rem; }
  input {
    width: 100%; background: rgba(247,242,234,0.07); border: 1px solid rgba(247,242,234,0.15);
    color: var(--cream); padding: 0.75rem 0.9rem; font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem; border-radius: 2px; outline: none; margin-bottom: 1.1rem;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--sage); }
  button {
    width: 100%; background: var(--sage); color: var(--cream); border: none;
    padding: 0.85rem; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase;
    border-radius: 2px; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: var(--sage-light); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #err {
    display: none; background: rgba(180,80,60,0.15); border: 1px solid rgba(180,80,60,0.35);
    color: rgba(247,242,234,0.9); font-size: 0.82rem; padding: 0.7rem 0.9rem;
    border-radius: 2px; margin-bottom: 1.1rem;
  }
  a.back { display: block; text-align: center; margin-top: 1.5rem; color: rgba(247,242,234,0.4); font-size: 0.78rem; text-decoration: none; }
</style>
</head>
<body>
  <div class="box">
    <h1>Cringley Cottage</h1>
    <p class="sub">Sign in to manage prices</p>
    <div id="err"></div>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="username">
      <label>Password</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" id="submitBtn">Sign In</button>
    </form>
    <form id="mfaForm" style="display:none;">
      <p class="sub" style="margin-bottom:1.4rem;">Enter the 6-digit code from your authenticator app.</p>
      <label>Verification code</label>
      <input type="text" id="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
      <button type="submit" id="mfaSubmitBtn">Verify</button>
      <a href="#" id="useBackupLink" class="back" style="margin-top:1rem;">Use a backup code instead</a>
    </form>
    <form id="backupForm" style="display:none;">
      <p class="sub" style="margin-bottom:1.4rem;">Enter one of your one-time backup codes.</p>
      <label>Backup code</label>
      <input type="text" id="backupCode" autocomplete="off" placeholder="XXXX-XXXX">
      <button type="submit" id="backupSubmitBtn">Verify</button>
      <a href="#" id="useCodeLink" class="back" style="margin-top:1rem;">Use my authenticator app instead</a>
    </form>
    <a href="index.html" class="back">&#8592; Back to site</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://yfeyswuxhgezkpcjhznp.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_96mc6z7EpkjnKPsMX0z5Ug_BJ7MDBNp';

    // Already signed in? Skip straight to the right place.
    (() => {
      const existing = localStorage.getItem('cc_session');
      if (existing) {
        try {
          const s = JSON.parse(existing);
          window.location.href = s.role === 'owner' ? 'admin.html' : 'staff-checklist.html';
        } catch (e) {}
      }
    })();

    // Holds the aal1 (password-only) session while a second factor is
    // pending, and the totp factor id once we know it. Never written to
    // localStorage until the second step (or the "no 2FA enrolled") passes.
    let pending = null;

    function showErr(text) {
      const errBox = document.getElementById('err');
      errBox.textContent = text;
      errBox.style.display = 'block';
    }

    function finishLogin(access_token, refresh_token, expires_in, role, user_id) {
      localStorage.setItem('cc_session', JSON.stringify({
        access_token, refresh_token,
        expires_at: Date.now() + (expires_in * 1000),
        role, user_id,
      }));
      window.location.href = role === 'owner' ? 'admin.html' : 'staff-checklist.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      document.getElementById('err').style.display = 'none';
      btn.disabled = true; btn.textContent = 'Signing in…';

      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          showErr(data.error_description || data.msg || 'Sign in failed — check your email and password.');
          btn.disabled = false; btn.textContent = 'Sign In';
          return;
        }
        const role = data.user?.app_metadata?.role || null;
        const verifiedFactor = (data.user?.factors || []).find(f => f.factor_type === 'totp' && f.status === 'verified');

        if (!verifiedFactor) {
          finishLogin(data.access_token, data.refresh_token, data.expires_in, role, data.user?.id || null);
          return;
        }

        // 2FA is enrolled on this account — hold the aal1 session and ask
        // for a second factor before granting access.
        pending = { access_token: data.access_token, refresh_token: data.refresh_token, expires_in: data.expires_in, role, user_id: data.user?.id || null, factorId: verifiedFactor.id };
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('mfaForm').style.display = 'block';
        document.getElementById('mfaCode').focus();
      } catch (e) {
        showErr('Something went wrong — please try again.');
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    });

    document.getElementById('mfaForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('mfaSubmitBtn');
      document.getElementById('err').style.display = 'none';
      btn.disabled = true; btn.textContent = 'Verifying…';
      try {
        const challengeRes = await fetch(`${SUPABASE_URL}/auth/v1/factors/${pending.factorId}/challenge`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${pending.access_token}` },
        });
        const challenge = await challengeRes.json();
        if (!challengeRes.ok) { showErr(challenge.error_description || challenge.msg || 'Could not start verification.'); btn.disabled = false; btn.textContent = 'Verify'; return; }

        const verifyRes = await fetch(`${SUPABASE_URL}/auth/v1/factors/${pending.factorId}/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${pending.access_token}` },
          body: JSON.stringify({ challenge_id: challenge.id, code: document.getElementById('mfaCode').value.trim() }),
        });
        const verify = await verifyRes.json();
        if (!verifyRes.ok) { showErr(verify.error_description || verify.msg || 'Incorrect code — please try again.'); btn.disabled = false; btn.textContent = 'Verify'; document.getElementById('mfaCode').value = ''; document.getElementById('mfaCode').focus(); return; }

        finishLogin(verify.access_token, verify.refresh_token, verify.expires_in, pending.role, pending.user_id);
      } catch (e) {
        showErr('Something went wrong — please try again.');
        btn.disabled = false; btn.textContent = 'Verify';
      }
    });

    document.getElementById('backupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('backupSubmitBtn');
      document.getElementById('err').style.display = 'none';
      btn.disabled = true; btn.textContent = 'Verifying…';
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/mfa-verify-backup-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${pending.access_token}` },
          body: JSON.stringify({ code: document.getElementById('backupCode').value.trim() }),
        });
        const data = await res.json();
        if (!data.ok) { showErr(data.error || 'Invalid backup code.'); btn.disabled = false; btn.textContent = 'Verify'; return; }
        finishLogin(pending.access_token, pending.refresh_token, pending.expires_in, pending.role, pending.user_id);
      } catch (e) {
        showErr('Something went wrong — please try again.');
        btn.disabled = false; btn.textContent = 'Verify';
      }
    });

    document.getElementById('useBackupLink').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('mfaForm').style.display = 'none';
      document.getElementById('backupForm').style.display = 'block';
      document.getElementById('err').style.display = 'none';
      document.getElementById('backupCode').focus();
    });
    document.getElementById('useCodeLink').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('backupForm').style.display = 'none';
      document.getElementById('mfaForm').style.display = 'block';
      document.getElementById('err').style.display = 'none';
      document.getElementById('mfaCode').focus();
    });
  </script>
</body>
</html>
